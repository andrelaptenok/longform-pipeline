version: v1

source:
  name: CKE, wypowiedź pisemna, poziom rozszerzony, Formuła 2023
  document: Informator o egzaminie maturalnym z języka angielskiego od roku szkolnego 2024/2025, sections 1.3.4 and 1.3.8
  points: zgodność z poleceniem 5 / spójność i logika wypowiedzi 2 / zakres środków językowych 3 / poprawność środków językowych 3
  total: 13
  share_of_exam: 22%
  length_asked: 200-250 words, stated in the task instruction
  length_scored: 180-280 words, the band that earns the length element of zgodność z poleceniem
  length_floor: below 160 words only zgodność z poleceniem is scored; every other criterion is 0 and errors are not marked
  dependencies: zgodność z poleceniem 0 forces every other criterion to 0; zgodność z poleceniem 1 caps every other criterion at 1
  weights: judge weights are the CKE point maxima; every dimension is still scored on the same 1-5 scale
  checked: 2026-07-26 against the informator itself
  verify: re-read when CKE publishes a new edition of the informator

deterministic:
  - id: length
    description: word count within the band CKE scores, not the narrower band the task asks for
    params: { min_words: 180, max_words: 280 }

  - id: sections_present
    description: all sections the task format requires are present
    params: { required: [] }

  - id: banned_constructions
    description: no spoken reductions and no generated-text boilerplate
    params:
      patterns:
        - '\bgonna\b'
        - '\bwanna\b'
        - '\bkinda\b'
        - '\bgotta\b'
        - "\\bin today's fast-paced world\\b"
        - '\bit is important to note that\b'
        - '\bdelve into\b'

judge:
  - id: content
    cke_name: zgodność z poleceniem
    weight: 5
    description: every element of the task is covered and developed, in the required format and register
    scale: 1-5
    anchors:
      '1': fewer than half the required elements are addressed, or the text drifts off the brief; a reader would not get what the task asked for
      '3': all required elements appear, but some are only named rather than developed; occasional padding or an off-topic passage
      '5': every element is present and developed, in the required format and register, with nothing off-brief

  - id: coherence
    cke_name: spójność i logika wypowiedzi
    weight: 2
    description: the text reads as one line of thought, carried by paragraphing and cohesive devices
    scale: 1-5
    anchors:
      '1': no visible progression; paragraphs are unordered and linking words are missing or misused, so the reader has to reconstruct the argument
      '3': the overall structure holds, but transitions are mechanical or one paragraph breaks the line of thought
      '5': a clear line from opening to closing; paragraphing and cohesive devices carry the reader without effort

  - id: range
    cke_name: zakres środków językowych
    weight: 3
    description: variety and precision of vocabulary and grammatical structures at the level the task expects
    scale: 1-5
    anchors:
      '1': elementary repetitive vocabulary and one or two sentence patterns, below the level of the task
      '3': adequate range with some variation, but reliant on common phrases and short of precise or idiomatic choices
      '5': varied and precise lexis and structures suited to the level and register, used naturally rather than for display

  - id: accuracy
    cke_name: poprawność środków językowych
    weight: 3
    description: grammar, lexis, spelling and punctuation, weighted by how far errors obscure meaning
    scale: 1-5
    anchors:
      '1': errors in basic structures and spelling that repeatedly obscure meaning
      '3': meaning stays clear, with recurring errors in complex structures, articles or prepositions
      '5': few minor errors that never obscure meaning; spelling and punctuation are consistent
